flutter_native_splash:
  # dart run flutter_native_splash:create
  # dart run flutter_native_splash:remove
  #
  # Colours match ColorScheme.surface in each theme (WaColors.white /
  # WaColors.neutralGray900) so the splash hands over to the Flutter theme
  # with no colour step. Re-run `dart run flutter_native_splash:create` after
  # editing.
  color: "#FFFFFF"
  color_dark: "#161717"
  image: assets/splash.png
  image_dark: assets/splash.png
  fullscreen: true

  # ANDROID 12+ configuration:
  android_12:
    color: "#FFFFFF"
    color_dark: "#161717"
    image: assets/splash12.png
    image_dark: assets/splash12.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#161717"
